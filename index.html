<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff5ed">
<title>A Little Note for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fffaf3;
  --pink: #e9a1ad;
  --pink-deep: #b96778;
  --ink: #56313e;
  --muted: #9a6d73;
  --gold: #d9a34b;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  color: var(--ink);
  font-family: "DM Sans", sans-serif;
  background:
    radial-gradient(ellipse at 12% 8%, rgba(255,255,255,.92), transparent 35%),
    radial-gradient(ellipse at 90% 90%, rgba(234,190,181,.34), transparent 32%),
    linear-gradient(145deg, #f7e6dc 0%, #fff6ed 48%, #f6e4e4 100%);
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .22;
  background-image: radial-gradient(#c48d8d .7px, transparent .7px);
  background-size: 11px 11px;
}
.page {
  position: relative;
  width: min(100%, 520px);
  isolation: isolate;
  animation: appear .7s ease both;
}
.note-card {
  position: relative;
  padding: clamp(30px, 7vw, 54px) clamp(22px, 6vw, 48px) 34px;
  text-align: center;
  background: linear-gradient(145deg, rgba(255,253,248,.98), rgba(255,246,234,.98));
  border: 1px solid rgba(185,103,120,.34);
  border-radius: 34px 30px 38px 29px;
  box-shadow: 0 22px 55px rgba(111,66,67,.14), 0 5px 0 rgba(233,161,173,.55), inset 0 0 0 7px rgba(255,255,255,.48);
}
.note-card::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid rgba(217,163,75,.32);
  border-radius: 27px 24px 31px 22px;
  pointer-events: none;
}
.top-heart {
  position: absolute;
  top: -24px;
  left: 50%;
  transform: translateX(-50%);
  display: grid;
  place-items: center;
  width: 58px;
  height: 54px;
  color: var(--pink-deep);
  font-size: 39px;
  line-height: 1;
  background: #f8c6cc;
  border: 3px solid #fff6ed;
  border-radius: 50% 50% 46% 46%;
  filter: drop-shadow(0 4px 5px rgba(126,73,81,.15));
}
.eyebrow {
  margin: 2px 0 24px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .24em;
  text-transform: uppercase;
}
.message {
  margin: 0 auto;
  max-width: 410px;
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(27px, 6.2vw, 39px);
  line-height: 1.35;
  font-weight: 600;
  letter-spacing: -.025em;
  text-wrap: balance;
}
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 27px 0 16px;
  color: var(--pink-deep);
}
.divider::before, .divider::after {
  content: "";
  width: min(19vw, 78px);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--pink-deep));
}
.divider::after { transform: scaleX(-1); }
.heart { font-size: 25px; line-height: 1; }
.footer {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
}
.decor { position: absolute; pointer-events: none; user-select: none; }
.sparkle { color: var(--gold); font-size: 31px; }
.sparkle.one { top: 70px; left: -12px; transform: rotate(-12deg); }
.sparkle.two { right: -9px; bottom: 92px; font-size: 26px; }
.heart-doodle { color: #d9879b; font-size: 30px; }
.heart-doodle.one { top: 120px; right: 1px; transform: rotate(14deg); }
.heart-doodle.two { bottom: 18px; left: 12px; font-size: 22px; transform: rotate(-12deg); }
.flowers {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin: 22px 10px 0;
  min-height: 74px;
}
.daisy {
  position: relative;
  width: 58px; height: 58px;
  transform: rotate(-12deg);
}
.daisy span {
  position: absolute;
  left: 22px; top: 2px;
  width: 14px; height: 28px;
  border-radius: 50%;
  background: #fffdf6;
  border: 1px solid #f0d9ce;
  transform-origin: 7px 27px;
}
.daisy span:nth-child(1) { transform: rotate(0deg); }
.daisy span:nth-child(2) { transform: rotate(45deg); }
.daisy span:nth-child(3) { transform: rotate(90deg); }
.daisy span:nth-child(4) { transform: rotate(135deg); }
.daisy span:nth-child(5) { transform: rotate(180deg); }
.daisy span:nth-child(6) { transform: rotate(225deg); }
.daisy span:nth-child(7) { transform: rotate(270deg); }
.daisy span:nth-child(8) { transform: rotate(315deg); }
.daisy::after {
  content: "";
  position: absolute;
  left: 24px; top: 24px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #e6b75e;
  box-shadow: 0 0 0 2px #f4d68f;
}
.flower-note {
  max-width: 150px;
  padding: 12px 15px;
  color: #754c55;
  background: #f4d2cf;
  border-radius: 3px 15px 4px 12px;
  box-shadow: 0 7px 18px rgba(111,66,67,.09);
  font-family: "Playfair Display", Georgia, serif;
  font-size: 15px;
  font-style: italic;
  transform: rotate(4deg);
}
@keyframes appear {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 380px) {
  body { padding: 24px 12px; }
  .note-card { border-radius: 26px; padding-left: 18px; padding-right: 18px; }
  .eyebrow { letter-spacing: .16em; font-size: 10px; }
  .message { font-size: clamp(25px, 7vw, 30px); }
  .flower-note { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .page { animation: none; }
}
</style>
</head>
<body>
<main class="page" aria-label="A little note for you">
  <span class="decor sparkle one" aria-hidden="true">✧</span>
  <span class="decor sparkle two" aria-hidden="true">✧</span>
  <span class="decor heart-doodle one" aria-hidden="true">♡</span>
  <span class="decor heart-doodle two" aria-hidden="true">♡</span>

  <section class="note-card" aria-live="polite">
    <span class="top-heart" aria-hidden="true">♡</span>
    <p class="eyebrow">A little note for you</p>
    <p class="message" id="note">Even the smallest steps are progress. You’re doing better than you think.</p>
    <div class="divider" aria-hidden="true"><span class="heart">♡</span></div>
    <p class="footer">Be proud of yourself</p>
  </section>

  <div class="flowers" aria-hidden="true">
    <div class="daisy"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="flower-note">Good things<br>take time.</div>
  </div>
</main>
<script src="notes.js"></script>
<script>
(() => {
  const fallback = ["Even the smallest steps are progress. You’re doing better than you think."];
  const notes = (typeof NOTES !== "undefined" && Array.isArray(NOTES) && NOTES.length)
    ? NOTES.filter(note => typeof note === "string" && note.trim())
    : fallback;
  const noteEl = document.getElementById("note");
  let index = -1;

  try {
    const saved = Number.parseInt(sessionStorage.getItem("currentNote"), 10);
    if (Number.isInteger(saved) && saved >= 0 && saved < notes.length) index = saved;
  } catch (_) {}

  if (index === -1) {
    let previous = -1;
    try {
      const stored = Number.parseInt(localStorage.getItem("lastNote"), 10);
      if (Number.isInteger(stored)) previous = stored;
    } catch (_) {}

    if (notes.length === 1) {
      index = 0;
    } else {
      do { index = Math.floor(Math.random() * notes.length); }
      while (index === previous);
    }

    try {
      sessionStorage.setItem("currentNote", String(index));
      localStorage.setItem("lastNote", String(index));
    } catch (_) {}
  }

  noteEl.textContent = notes[index] || fallback[0];
})();
</script>
</body>
</html>
